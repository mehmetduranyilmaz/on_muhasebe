# Geliştirme ortamı: PostgreSQL ve e-posta test sunucusu (Mailpit). API ve Web `dotnet run` ile çalışır.
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: onmuhasebe-postgres
    environment:
      POSTGRES_DB: onmuhasebe
      POSTGRES_USER: onmuhasebe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onmuhasebe_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 imajında veri dizini sürüm alt klasöründe; bağlama noktası /var/lib/postgresql olmalı.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onmuhasebe -d onmuhasebe"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bildirim e-postaları: SMTP localhost:1025, gelen kutusu http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: onmuhasebe-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
